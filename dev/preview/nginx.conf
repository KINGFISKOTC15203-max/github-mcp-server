# Serves the preview console on port 3000 and proxies the MCP Streamable HTTP
# endpoint of the Go server under /mcp, so the console is same-origin with the
# API (no CORS, no cross-site session handling).
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # MCP Streamable HTTP endpoint. Responses are Server-Sent Events, so
    # buffering must stay off and the read timeout must outlive a tool call.
    location /mcp {
        proxy_pass http://api:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Unauthenticated OAuth protected-resource metadata, shown in the console
    # to prove the API is reachable.
    location /.well-known/ {
        proxy_pass http://api:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
